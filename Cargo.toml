[package]
name = "fdthing"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
egui = "0.31"
ignore = "0.4"
regex = "1"
rfd = "0.14"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# [package.metadata.dist.changelog]
# # Specifica che il changelog è gestito da git-cliff
# command = "git-cliff"
# args = ["--latest", "--strip", "header"]

[package.metadata.dist.changelog]
command = "sh"
args = ["-c", "git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:'- %s' 2>/dev/null || git log --pretty=format:'- %s'"]